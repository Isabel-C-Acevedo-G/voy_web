<div class="pointer-events-none fixed top-4 right-4 z-50 flex w-[min(22rem,calc(100vw-2rem))] flex-col gap-2">
  @for (m of alerts.messages(); track m.id) {
    <div
      class="pointer-events-auto animate-fade-in rounded-xl border px-4 py-3 text-sm shadow-sm"
      [class]="
        m.kind === 'success'
          ? 'border-emerald-200 bg-emerald-50 text-emerald-900'
          : m.kind === 'error'
            ? 'border-red-200 bg-red-50 text-red-800'
            : m.kind === 'warning'
              ? 'border-amber-200 bg-amber-50 text-amber-900'
              : 'border-emerald-100 bg-white text-emerald-900'
      "
      role="status"
    >
      <div class="flex items-start justify-between gap-3">
        <p>{{ m.text }}</p>
        <button
          type="button"
          class="shrink-0 text-xs font-semibold opacity-70 hover:opacity-100"
          (click)="dismiss(m.id)"
        >
          Cerrar
        </button>
      </div>
    </div>
  }
</div>
