@if (total() > pageSize()) {
  <nav
    class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-emerald-100 bg-white px-4 py-3 text-sm text-emerald-800"
    aria-label="Paginación"
  >
    <p>
      {{ from() }}–{{ to() }} de {{ total() }}
    </p>
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="rounded-xl border border-emerald-200 px-3 py-1.5 font-medium hover:bg-emerald-50 disabled:cursor-not-allowed disabled:opacity-40"
        [disabled]="page() <= 1"
        (click)="prev()"
      >
        Anterior
      </button>
      <span class="min-w-[5.5rem] text-center tabular-nums">
        Pág. {{ page() }} / {{ totalPages() }}
      </span>
      <button
        type="button"
        class="rounded-xl border border-emerald-200 px-3 py-1.5 font-medium hover:bg-emerald-50 disabled:cursor-not-allowed disabled:opacity-40"
        [disabled]="page() >= totalPages()"
        (click)="next()"
      >
        Siguiente
      </button>
    </div>
  </nav>
}
