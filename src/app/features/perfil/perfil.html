<section class="mx-auto max-w-lg space-y-6">
  <header>
    <h1 class="text-3xl font-extrabold text-emerald-950">Mi perfil</h1>
    <p class="text-emerald-700">
      Datos personales.
      @if (rol(); as r) {
        <span class="rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-medium text-emerald-800"
          >{{ r }}</span
        >
      }
    </p>
  </header>

  @if (error(); as err) {
    <div class="rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{{ err }}</div>
  }
  @if (ok(); as msg) {
    <div class="rounded-xl bg-emerald-50 px-4 py-3 text-sm text-emerald-800">{{ msg }}</div>
  }

  @if (loading()) {
    <p class="text-emerald-700">Cargando…</p>
  } @else {
    <form
      class="space-y-4 rounded-[var(--radius-card)] border border-emerald-100 bg-white p-6 shadow-sm"
      [formGroup]="form"
      (ngSubmit)="submit()"
    >
      <label class="block space-y-1">
        <span class="text-sm font-medium text-emerald-800">Nombre</span>
        <input formControlName="nombre" class="w-full rounded-xl border border-emerald-200 px-3 py-2" />
      </label>
      <label class="block space-y-1">
        <span class="text-sm font-medium text-emerald-800">Teléfono</span>
        <input formControlName="telefono" class="w-full rounded-xl border border-emerald-200 px-3 py-2" />
      </label>
      <label class="block space-y-1">
        <span class="text-sm font-medium text-emerald-800">Correo</span>
        <input
          formControlName="correo"
          class="w-full rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-2"
        />
      </label>
      <div class="grid gap-3 sm:grid-cols-2">
        <label class="block space-y-1">
          <span class="text-sm font-medium text-emerald-800">Tipo doc.</span>
          <input
            formControlName="tipoDocumento"
            class="w-full rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-2"
          />
        </label>
        <label class="block space-y-1">
          <span class="text-sm font-medium text-emerald-800">Documento</span>
          <input
            formControlName="documento"
            class="w-full rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-2"
          />
        </label>
      </div>
      <p class="text-xs text-emerald-600">Correo y documento no se editan aquí.</p>
      <button
        type="submit"
        class="rounded-xl bg-emerald-500 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-600 disabled:opacity-60"
        [disabled]="saving()"
      >
        {{ saving() ? 'Guardando…' : 'Guardar cambios' }}
      </button>
    </form>
  }
</section>
