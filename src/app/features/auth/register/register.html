<section
  class="mx-auto flex min-h-screen w-full max-w-md flex-col items-center justify-center px-4 py-10"
>
  <header class="mb-8 w-full text-center">
    <span class="inline-block rounded-lg bg-emerald-500 px-3 py-1 text-lg font-extrabold text-white"
      >VOY</span
    >
    <h1 class="mt-4 text-3xl font-extrabold text-emerald-950">Crear cuenta</h1>
    <p class="mt-1 text-sm text-emerald-700">Registro público como ciclista (sin selector de rol)</p>
  </header>

  @if (error(); as err) {
    <div class="mb-4 w-full rounded-xl bg-red-50 px-4 py-3 text-center text-sm text-red-700">
      {{ err }}
    </div>
  }

  <form
    class="w-full space-y-4 rounded-[var(--radius-card)] border border-emerald-100 bg-white p-6 shadow-sm"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <label class="block space-y-1">
      <span class="text-sm font-medium text-emerald-800">Nombre</span>
      <input
        formControlName="nombre"
        class="w-full rounded-xl border border-emerald-200 px-3 py-2 outline-none focus:border-emerald-500"
      />
    </label>

    <div class="grid w-full gap-4 sm:grid-cols-2">
      <label class="block space-y-1">
        <span class="text-sm font-medium text-emerald-800">Tipo doc.</span>
        <select
          formControlName="tipoDocumento"
          class="w-full rounded-xl border border-emerald-200 px-3 py-2 outline-none focus:border-emerald-500"
        >
          @for (t of tipos; track t) {
            <option [value]="t">{{ t }}</option>
          }
        </select>
      </label>
      <label class="block space-y-1">
        <span class="text-sm font-medium text-emerald-800">Documento</span>
        <input
          formControlName="documento"
          class="w-full rounded-xl border border-emerald-200 px-3 py-2 outline-none focus:border-emerald-500"
        />
      </label>
    </div>

    <label class="block space-y-1">
      <span class="text-sm font-medium text-emerald-800">Correo</span>
      <input
        type="email"
        formControlName="correo"
        class="w-full rounded-xl border border-emerald-200 px-3 py-2 outline-none focus:border-emerald-500"
      />
    </label>

    <label class="block space-y-1">
      <span class="text-sm font-medium text-emerald-800">Teléfono (opcional)</span>
      <input
        formControlName="telefono"
        class="w-full rounded-xl border border-emerald-200 px-3 py-2 outline-none focus:border-emerald-500"
      />
    </label>

    <label class="block space-y-1">
      <span class="text-sm font-medium text-emerald-800">Clave</span>
      <input
        type="password"
        formControlName="clave"
        class="w-full rounded-xl border border-emerald-200 px-3 py-2 outline-none focus:border-emerald-500"
      />
      <span class="text-xs text-emerald-600">Mín. 8 · mayúscula · minúscula · número · sin espacios</span>
    </label>

    <label class="flex items-start gap-2 text-sm text-emerald-800">
      <input type="checkbox" formControlName="aceptaTratamientoDatos" class="mt-1" />
      <span>Acepto el tratamiento de datos (Ley 1581)</span>
    </label>

    <button
      type="submit"
      class="w-full rounded-xl bg-emerald-500 py-2.5 font-semibold text-white hover:bg-emerald-600 disabled:opacity-60"
      [disabled]="loading()"
    >
      {{ loading() ? 'Registrando…' : 'Registrarme' }}
    </button>
  </form>

  <p class="mt-6 w-full text-center text-sm text-emerald-700">
    ¿Ya tienes cuenta?
    <a routerLink="/login" class="font-semibold text-emerald-600 hover:underline">Inicia sesión</a>
  </p>
</section>
