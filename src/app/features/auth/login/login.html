<section
  class="mx-auto flex min-h-screen w-full max-w-md flex-col items-center justify-center px-4 py-10"
>
  <header class="mb-8 w-full text-center">
    <span class="inline-block rounded-lg bg-emerald-500 px-3 py-1 text-lg font-extrabold text-white"
      >VOY</span
    >
    <h1 class="mt-4 text-3xl font-extrabold text-emerald-950">Iniciar sesión</h1>
    <p class="mt-1 text-sm text-emerald-700">Correo o documento · JWT 30 min</p>
  </header>

  @if (flash(); as msg) {
    <div class="mb-4 w-full rounded-xl bg-amber-50 px-4 py-3 text-center text-sm text-amber-800">
      {{ msg }}
    </div>
  }
  @if (error(); as err) {
    <div class="mb-4 w-full rounded-xl bg-red-50 px-4 py-3 text-center text-sm text-red-700">
      {{ err }}
    </div>
  }

  <form
    class="w-full space-y-4 rounded-[var(--radius-card)] border border-emerald-100 bg-white p-6 shadow-sm"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <label class="block space-y-1">
      <span class="text-sm font-medium text-emerald-800">Usuario</span>
      <input
        formControlName="username"
        autocomplete="username"
        class="w-full rounded-xl border border-emerald-200 px-3 py-2 text-emerald-950 outline-none focus:border-emerald-500"
        placeholder="correo o documento"
      />
    </label>

    <label class="block space-y-1">
      <span class="text-sm font-medium text-emerald-800">Clave</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="w-full rounded-xl border border-emerald-200 px-3 py-2 text-emerald-950 outline-none focus:border-emerald-500"
      />
    </label>

    <button
      type="submit"
      class="w-full rounded-xl bg-emerald-500 py-2.5 font-semibold text-white hover:bg-emerald-600 disabled:opacity-60"
      [disabled]="loading()"
    >
      {{ loading() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <p class="mt-6 w-full text-center text-sm text-emerald-700">
    ¿Sin cuenta?
    <a routerLink="/register" class="font-semibold text-emerald-600 hover:underline">Regístrate</a>
  </p>
</section>
