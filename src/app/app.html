<app-alert />

@if (showShell()) {
  <div class="min-h-screen bg-emerald-50 text-emerald-950">
    <app-sidebar />

    <div class="flex min-h-screen min-w-0 flex-col md:pl-56">
      <main class="page-enter mx-auto w-full max-w-5xl flex-1 px-4 py-6 sm:px-6 md:py-8">
        <router-outlet />
      </main>

      <footer class="border-t border-emerald-100 py-3 text-center text-xs text-emerald-600">
        voy_web · Angular + Tailwind Emerald · v1.0.0
      </footer>
    </div>
  </div>
} @else {
  <div
    class="page-enter flex min-h-screen w-full flex-col bg-gradient-to-br from-emerald-50 via-white to-emerald-100 text-emerald-950"
  >
    <router-outlet />
  </div>
}
