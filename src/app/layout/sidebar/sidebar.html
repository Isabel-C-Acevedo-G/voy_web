<!-- Barra móvil -->
<div
  class="sticky top-0 z-40 flex items-center justify-between border-b border-emerald-100 bg-emerald-50/95 px-4 py-3 backdrop-blur md:hidden"
>
  <a routerLink="/" class="flex items-center gap-2">
    <span class="rounded-lg bg-emerald-500 px-2 py-1 text-sm font-extrabold text-white">VOY</span>
    <span class="text-sm font-semibold text-emerald-900">Parqueaderos</span>
  </a>
  <button
    type="button"
    class="rounded-xl border border-emerald-200 px-3 py-1.5 text-sm font-medium text-emerald-800"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
  >
    Menú
  </button>
</div>

@if (open()) {
  <button
    type="button"
    class="fixed inset-0 z-40 bg-emerald-950/30 md:hidden"
    aria-label="Cerrar menú"
    (click)="close()"
  ></button>
}

<aside
  class="fixed inset-y-0 left-0 z-50 flex h-dvh w-64 max-w-[85vw] translate-x-[-105%] flex-col border-r border-emerald-100 bg-gradient-to-b from-emerald-50 to-white transition-transform duration-200 ease-out md:w-56 md:max-w-none md:translate-x-0"
  [class.translate-x-0]="open()"
>
  <div class="shrink-0 border-b border-emerald-100 px-4 py-5">
    <a routerLink="/" class="flex items-center gap-2">
      <span
        class="rounded-lg bg-emerald-500 px-2 py-1 text-sm font-extrabold tracking-wide text-white"
      >
        VOY
      </span>
      <span class="text-sm font-semibold text-emerald-900">Parqueaderos</span>
    </a>
    @if (rol(); as r) {
      <p class="mt-2">
        <span
          class="rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-medium text-emerald-800"
          >{{ r }}</span
        >
      </p>
    }
  </div>

  <nav class="min-h-0 flex-1 overflow-y-auto px-3 py-4">
    <ul class="space-y-1">
      @for (link of links(); track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-emerald-100 text-emerald-800"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            class="block rounded-xl px-3 py-2 text-sm font-medium text-emerald-700 transition-colors hover:bg-emerald-50"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="shrink-0 border-t border-emerald-100 px-4 py-3">
    @if (user(); as u) {
      <p class="truncate text-xs font-medium text-emerald-900">{{ u.nombre }}</p>
      <p class="truncate text-xs text-emerald-600">{{ u.correo }}</p>
    }
    <button
      type="button"
      class="mt-2 w-full rounded-xl border border-emerald-200 px-3 py-1.5 text-sm font-medium text-emerald-800 transition-colors hover:bg-emerald-50"
      (click)="logout()"
    >
      Cerrar sesión
    </button>
  </div>
</aside>
